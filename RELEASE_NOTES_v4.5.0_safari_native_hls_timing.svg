<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="desc">
  <desc id="desc">RxPlayer timing APIs rely mainly on browser media element timing in directfile mode, and mainly on parsed Manifest and segment data for regular transports while still using media element attributes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#6b7280"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #202124;
      }
      .label {
        font-size: 16px;
        font-weight: 700;
      }
      .small {
        font-size: 13px;
        fill: #5f6368;
      }
      .code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
      }
      .arrow {
        fill: none;
        stroke: #6b7280;
        stroke-width: 2;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect x="174" y="34" width="412" height="86" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="380" y="68" text-anchor="middle" class="label">RxPlayer timing APIs</text>
  <text x="380" y="94" text-anchor="middle" class="code">startAt / getMinimumPosition / getMaximumPosition</text>

  <path class="arrow" d="M316 120 C250 154 212 176 190 214"/>
  <rect x="164" y="146" width="116" height="24" fill="#ffffff"/>
  <text x="222" y="164" text-anchor="middle" class="small">directfile mode</text>

  <path class="arrow" d="M444 120 C510 154 548 176 570 214"/>
  <rect x="480" y="146" width="130" height="24" fill="#ffffff"/>
  <text x="545" y="164" text-anchor="middle" class="small">regular transports</text>

  <rect x="54" y="214" width="296" height="126" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="202" y="248" text-anchor="middle" class="label">Browser media element</text>
  <rect x="92" y="274" width="220" height="24" fill="#ffffff" stroke="#b7d9bd" stroke-width="1.5"/>
  <text x="202" y="291" text-anchor="middle" class="small">media element attributes</text>
  <text x="202" y="322" text-anchor="middle" class="code">duration / seekable / getStartDate()</text>

  <rect x="410" y="214" width="296" height="126" fill="#f8f9fa" stroke="#5f6368" stroke-width="1.5"/>
  <text x="558" y="248" text-anchor="middle" class="label">RxPlayer parsed data</text>

  <rect x="448" y="274" width="104" height="28" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="500" y="293" text-anchor="middle" class="small">Manifest</text>
  <rect x="564" y="274" width="104" height="28" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="616" y="293" text-anchor="middle" class="small">segments</text>
  <rect x="448" y="308" width="220" height="24" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="558" y="325" text-anchor="middle" class="small">media element attributes</text>
</svg>
