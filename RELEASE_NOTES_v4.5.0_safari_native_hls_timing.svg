<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Safari native HLS timing information</title>
  <desc id="desc">With directfile on Safari HLS, timing may come from the native media element rather than RxPlayer Manifest data.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#5f6368"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #202124; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #5f6368; }
    </style>
  </defs>
  <rect width="920" height="320" rx="18" fill="#ffffff"/>
  <rect x="44" y="76" width="220" height="130" rx="14" fill="#fff4f6" stroke="#ec3655" stroke-width="3"/>
  <text x="154" y="116" text-anchor="middle" class="label">Application</text>
  <text x="154" y="148" text-anchor="middle" class="body">directfile</text>
  <text x="154" y="172" text-anchor="middle" class="body">Safari HLS</text>
  <rect x="350" y="42" width="220" height="92" rx="14" fill="#f8f9fa" stroke="#5f6368" stroke-width="3"/>
  <text x="460" y="80" text-anchor="middle" class="label">Native player</text>
  <text x="460" y="108" text-anchor="middle" class="small">media element timing</text>
  <rect x="350" y="184" width="220" height="92" rx="14" fill="#eef6ff" stroke="#1a73e8" stroke-width="3"/>
  <text x="460" y="222" text-anchor="middle" class="label">RxPlayer</text>
  <text x="460" y="250" text-anchor="middle" class="small">minimum / maximum position</text>
  <rect x="656" y="76" width="220" height="130" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="3"/>
  <text x="766" y="116" text-anchor="middle" class="label">Better behavior</text>
  <text x="766" y="148" text-anchor="middle" class="body">live offsets</text>
  <text x="766" y="172" text-anchor="middle" class="body">wall-clock starts</text>
  <path d="M264 136c46-58 54-58 74-58" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M264 146c46 70 54 82 74 82" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M570 88c48 0 52 36 74 46" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M570 230c48 0 52-58 74-72" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
