name: RxPlayer npm publishing

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # Official releases: v1.0.0, v2.3.4
      - "v[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+" # Dev releases: v1.0.0-dev....
  workflow_dispatch: # Manual triggering for failed tag commits

jobs:
  determine_release_type:
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.release_type.outputs.type }}

    steps:
      - name: Set release type
        id: release_type
        run: |
          echo "Analyzing tag: ${{ github.ref }}"

          if [[ ${{ github.ref }} =~ refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+ ]]; then
            echo "type=dev" >> $GITHUB_OUTPUT
            echo "This is a dev release"
          else
            echo "type=official" >> $GITHUB_OUTPUT
            echo "This is an official release"
          fi

  check_official_version:
    if: needs.determine_release_type.outputs.release_type == 'official'
    runs-on: ubuntu-latest
    needs:
      - determine_release_type
    steps:
      - uses: actions/checkout@v4
      - name: Check last commit contains right version tag
        id: getversion
        run: |
          TAG=$(git describe --tags --exact-match HEAD)   # tag on current commit
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "No compatible semver tag on HEAD; exiting."
            exit 1
          fi

  general_release_checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - run: npm ci
      - run: rustup target add wasm32-unknown-unknown # Needed for fmt:rust:check
      - run: npm run fmt:prettier:check # js formatting
      - run: npm run fmt:rust:check # rs formatting
      - run: npm run types:all
      - run: npm run lint:all
      - run: npm run test:unit # Run RxPlayer unit tests

  integration_linux_chrome:
    uses: ./.github/workflows/integration_tests_base.yml
    with: { os: "ubuntu-latest", browser: "chrome" }

  integration_linux_firefox:
    uses: ./.github/workflows/integration_tests_base.yml
    with: { os: "ubuntu-latest", browser: "firefox" }

  # NOTE: Too instable - most of the time it does not run. Commented out for now
  # integration_linux_edge:
  #   uses: ./.github/workflows/integration_tests_base.yml
  #   with: { os: "ubuntu-latest", browser: "edge" }

  integration_windows_chrome:
    uses: ./.github/workflows/integration_tests_base.yml
    with: { os: "windows-latest", browser: "chrome" }

  integration_windows_firefox:
    uses: ./.github/workflows/integration_tests_base.yml
    with: { os: "windows-latest", browser: "firefox" }

  integration_windows_edge:
    uses: ./.github/workflows/integration_tests_base.yml
    with: { os: "windows-latest", browser: "edge" }

  memory_linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      # needed for integration & memory tests codecs support
      - run:
          sudo add-apt-repository multiverse && sudo apt update && sudo apt install -y
          ubuntu-restricted-extras
      - run: npm ci
      - run: npm run build
      - run: npm run test:memory

  performance_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      # needed for codecs support
      - run:
          sudo add-apt-repository multiverse && sudo apt update && sudo apt install -y
          ubuntu-restricted-extras
      - run: npm ci
      - run: export DISPLAY=:99
      - run: sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & # optional
      - run:
          npm run test:performance -- --branch stable --remote-git-url
          https://github.com/canalplus/rx-player.git

  publish_dev:
    if: needs.determine_release_type.outputs.release_type == 'dev'
    runs-on: ubuntu-latest
    needs:
      - determine_release_type
      - general_release_checks
      - integration_linux_chrome
      - integration_linux_firefox
      # - integration_linux_edge
      - integration_windows_chrome
      - integration_windows_firefox
      - integration_windows_edge
      - memory_linux

    permissions:
      id-token: write # required for npm provenance

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          # Use the latest available patch in the current major line instead of
          # mutating the bundled npm in-place during publishing.
          node-version: 24
          check-latest: true
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: get_version
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=\"$VERSION\"" >> "$GITHUB_OUTPUT"

          # Create canal version (replace -dev. with -canal.)
          CANAL_VERSION="${VERSION/-dev./-canal.}"
          echo "canal_version=$CANAL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if canal patch can be applied
        run: |
          echo "Checking if canal patch can be applied..."
          if ! git apply --check ./scripts/canal-release.patch; then
            echo "Error: Canal patch cannot be applied cleanly!"
            echo "Please resolve conflicts in the patch file before proceeding."
            exit 1
          fi
          echo "Canal patch check passed ✓"

      - name: Install RxPlayer dependencies
        run: npm ci

      - name: Update version for dev release
        run: npm run update-version "${{ steps.get_version.outputs.version }}"

      - name: Build, check and publish dev version
        run: |
          npm run build
          PACKAGE_DIRECTORY="$RUNNER_TEMP/rx-player-dev-package"
          mkdir -p "$PACKAGE_DIRECTORY"
          PACKAGE_NAME=$(npm pack --silent --pack-destination "$PACKAGE_DIRECTORY")
          PACKAGE_PATH="$PACKAGE_DIRECTORY/$PACKAGE_NAME"
          node scripts/check_package_build.mjs --package "$PACKAGE_PATH"
          npm publish "$PACKAGE_PATH" --tag dev --provenance

      - name: Apply Canal+ patch
        run: git apply ./scripts/canal-release.patch

      - name: Update version for canal release
        run: npm run update-version "${{ steps.get_version.outputs.canal_version }}"

      - name: Build, check and publish Canal version
        run: |
          npm run build
          PACKAGE_DIRECTORY="$RUNNER_TEMP/rx-player-canal-package"
          mkdir -p "$PACKAGE_DIRECTORY"
          PACKAGE_NAME=$(npm pack --silent --pack-destination "$PACKAGE_DIRECTORY")
          PACKAGE_PATH="$PACKAGE_DIRECTORY/$PACKAGE_NAME"
          node scripts/check_package_build.mjs --package "$PACKAGE_PATH"
          npm publish "$PACKAGE_PATH" --tag canal --provenance

  publish_official:
    if: needs.determine_release_type.outputs.release_type == 'official'
    runs-on: ubuntu-latest
    needs:
      - determine_release_type
      - check_official_version
      - general_release_checks
      - integration_linux_chrome
      - integration_linux_firefox
      # - integration_linux_edge
      - integration_windows_chrome
      - integration_windows_firefox
      - integration_windows_edge
      - memory_linux

    permissions:
      contents: write
      id-token: write # required for npm provenance

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # fetch all branches and history
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          # Avoid relying on a cached lts/* alias and let setup-node resolve the
          # newest available Node 24 patch for the release.
          node-version: 24
          check-latest: true
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install RxPlayer dependencies
        run: npm ci

      - name: Build and check official package
        run: |
          npm run build
          PACKAGE_DIRECTORY="$RUNNER_TEMP/rx-player-official-package"
          mkdir -p "$PACKAGE_DIRECTORY"
          PACKAGE_NAME=$(npm pack --silent --pack-destination "$PACKAGE_DIRECTORY")
          PACKAGE_PATH="$PACKAGE_DIRECTORY/$PACKAGE_NAME"
          node scripts/check_package_build.mjs --package "$PACKAGE_PATH"
          echo "PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"

      - name: Merge on stable branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin stable:stable
          git checkout stable
          if ! git merge --ff-only ${{ github.ref_name }}; then
            echo "Error: Cannot fast-forward merge. The stable branch may be ahead of the release branch."
            exit 1
          fi

      - name: Now align the dev branch on stable
        run: |
          git fetch origin dev:dev
          git checkout dev
          if ! git rebase stable; then
            echo "Could not rebase dev on stable. Please check for any conflict first"
            exit 1
          fi
          git push origin dev --force-with-lease

      - name: Push stable branch
        run: |
          git checkout stable # go back to stable for publish
          git push origin stable

      - name: Publish official release
        run: npm publish "$PACKAGE_PATH" --provenance
