<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">reload relative offset behavior</title>
  <desc id="desc">Before, reload with a relative offset could require try catch when no previous position was known. Now the ambiguous relative offset is ignored.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#5f6368"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #202124; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 16px; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
    </style>
  </defs>
  <rect width="980" height="360" rx="18" fill="#ffffff"/>
  <text x="245" y="48" text-anchor="middle" class="label">Before</text>
  <rect x="44" y="78" width="180" height="70" rx="12" fill="#fff4f6" stroke="#ec3655" stroke-width="3"/>
  <text x="134" y="120" text-anchor="middle" class="code">try { reload }</text>
  <rect x="306" y="78" width="180" height="70" rx="12" fill="#fff8e1" stroke="#fbbc04" stroke-width="3"/>
  <text x="396" y="110" text-anchor="middle" class="body">previous position</text>
  <text x="396" y="132" text-anchor="middle" class="body">unknown</text>
  <rect x="176" y="218" width="180" height="70" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="3"/>
  <text x="266" y="260" text-anchor="middle" class="body" fill="#d93025">catch error</text>
  <path d="M224 113h62" stroke="#5f6368" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M396 148c0 42-48 66-88 70" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <line x1="510" y1="62" x2="510" y2="310" stroke="#dadce0" stroke-width="3"/>
  <text x="735" y="48" text-anchor="middle" class="label">Now</text>
  <rect x="556" y="78" width="180" height="70" rx="12" fill="#fff4f6" stroke="#ec3655" stroke-width="3"/>
  <text x="646" y="120" text-anchor="middle" class="code">reload()</text>
  <rect x="786" y="78" width="150" height="70" rx="12" fill="#f8f9fa" stroke="#5f6368" stroke-width="3"/>
  <text x="861" y="110" text-anchor="middle" class="body">relative offset</text>
  <text x="861" y="132" text-anchor="middle" class="body">ambiguous</text>
  <rect x="660" y="218" width="190" height="70" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="3"/>
  <text x="755" y="260" text-anchor="middle" class="body" fill="#188038">ignored, no throw</text>
  <path d="M736 113h30" stroke="#5f6368" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M861 148c0 42-42 66-86 70" stroke="#188038" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
