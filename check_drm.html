    async function waitForMessageEvent(session) {
      return new Promise((resolve, reject) => {
        session.addEventListener("message", (event) => {
          resolve(event);
        });
      });
    }

    function returnProviderName(keySystem) {
      if (keySystem.includes("microsoft")) {
        return "Microsoft";
      }
      if (keySystem.includes("widevine")) {
        return "Widevine";
      }
      if (keySystem.includes("apple")) {
        return "Apple";
      }
      return "Others";
    }

    async function checkOneKeySystem(keySystemIdentifier, configuration) {
      const startTime = performance.now();
      const checkStatus = {
        requestMediaKeySystemAccess: undefined,
        createMediaKeys: undefined,
        createSession: undefined,
        generateRequest: undefined,
      };

      /* Check `requestMediaKeySystemAccess` */
      let keySystemAccess;
      try {
        keySystemAccess = await navigator.requestMediaKeySystemAccess(
          keySystemIdentifier,
          configuration
        );
        checkStatus.requestMediaKeySystemAccess = { support: true, time: performance.now() - startTime };
      } catch (err) {
        checkStatus.requestMediaKeySystemAccess = { support: false, time: performance.now() - startTime };
        return {
          provider: returnProviderName(keySystemIdentifier),
          keySystem: keySystemIdentifier,
          supported: false,
          checkStatus,
          error: err,
          totalTime: performance.now() - startTime
        };
      }

      if (keySystemAccess === undefined) {
        checkStatus.requestMediaKeySystemAccess = { support: false, time: performance.now() - startTime };
        return {
          provider: returnProviderName(keySystemIdentifier),
          keySystem: keySystemIdentifier,
          supported: false,
          checkStatus,
          totalTime: performance.now() - startTime
        };
      }

      /* Check `createMediaKeys` */

      let checkTime = performance.now();

      let mediaKeys;
      try {
        mediaKeys = await keySystemAccess.createMediaKeys();
        checkStatus.createMediaKeys = { support: true, time: performance.now() - checkTime };
      } catch (err) {
        checkStatus.createMediaKeys = { support: false, time: performance.now() - checkTime };
        return {
          provider: returnProviderName(keySystemIdentifier),
          keySystem: keySystemIdentifier,
          supported: false,
          checkStatus,
          error: err,
          totalTime: performance.now() - startTime
        };
      }
      if (mediaKeys === undefined) {
        checkStatus.createMediaKeys = { support: false, time: performance.now() - checkTime };
        return {
          provider: returnProviderName(keySystemIdentifier),
          keySystem: keySystemIdentifier,
          supported: false,
          checkStatus,
          totalTime: performance.now() - startTime
        };
      }

      /* Check `createSession` */
      checkTime = performance.now();

      let session;
      try {
        const sessionType /* temporary or persistent-license */ =
          configuration[0].sessionTypes[0];
        session = await mediaKeys.createSession(sessionType);
        checkStatus.createSession = { support: true, time: performance.now() - checkTime };
      } catch (err) {
        checkStatus.createSession = { support: false, time: performance.now() - checkTime };
        return {
          provider: returnProviderName(keySystemIdentifier),
          keySystem: keySystemIdentifier,
          supported: false,
          checkStatus,
          error: err,
          totalTime: performance.now() - startTime
        };
      }
      if (session === undefined) {
        checkStatus.createSession = { support: false, time: performance.now() - checkTime };
        return {
          provider: returnProviderName(keySystemIdentifier),
          keySystem: keySystemIdentifier,
          supported: false,
          checkStatus,
          totalTime: performance.now() - startTime
        };
      }

      /* Check `generateRequest` */
      checkTime = performance.now()
      let generateRequest;
      let initData;
      if (keySystemIdentifier.includes("widevine")) {
        initData = initDataWidevine;
      } else if (keySystemIdentifier.includes("playready")) {
        initData = initDataPlayReady;
      }
      if (initData === undefined) {
        // this page does not handle initData for the particular keySystem,
        // just skip this step and consider it supported
        return {
          provider: returnProviderName(keySystemIdentifier),
          keySystem: keySystemIdentifier,
          supported: true,
          checkStatus,
          totalTime: performance.now() - startTime
        };
      }

      try {
        const [messageEvent, generateRequestResult] =
          await Promise.all([
            waitForMessageEvent(session),
            session.generateRequest("cenc", initData),
          ]);
        checkStatus.generateRequest = { support: true, time: performance.now() - checkTime };
      } catch (err) {
        checkStatus.generateRequest = { support: false, time: performance.now() - checkTime };
        return {
          provider: returnProviderName(keySystemIdentifier),
          keySystem: keySystemIdentifier,
          supported: false,
          checkStatus,
          error: err,
          totalTime: performance.now() - startTime
        };
      }
      return {
        provider: returnProviderName(keySystemIdentifier),
        keySystem: keySystemIdentifier,
        supported: true,
        checkStatus,
        totalTime: performance.now() - startTime
      };
    }
    function renderKeySystemResult(resultElement, results) {
      resultElement.innerHTML = "";

      const tableHead = `
            <thead>
              <tr>
                <th>Provider</th>
                <th>Key System</th>
                <th>Supported</th>
                <th>requestMediaKeySystemAccess</th>
                <th>createMediaKeys</th>
                <th>createSession</th>
                <th>generateRequest</th>
                <th>Time</th>
              </tr>
            </thead>
        `;

      const table = resultElement;
      resultElement.innerHTML = tableHead;
      let htmlBuffer = "";

      // Count occurrences
      const counts = {};
      results.forEach((result) => {
        if (counts[result.provider]) {
          counts[result.provider]++;
        } else {
          counts[result.provider] = 1;
        }
      });

      results.forEach((result) => {
        htmlBuffer += `<tr>
        ${counts[result.provider] > 0
            ? `<td rowspan="${counts[result.provider]}">${result.provider}</td>`
            : ""
          }
          <td>${result.keySystem}</td>
          <td class="${result.supported ? "support-OK" : "support-KO"}">${result.supported ? "&#10004;" : "&#10060;"
          }</td>

          ${Object.keys(result.checkStatus)
            .map(
              (key) =>
                `<td class="${result.checkStatus[key] === undefined
                  ? "support-unknown"
                  : result.checkStatus[key].support
                    ? "support-OK"
                    : "support-KO"
                }">${result.checkStatus[key] === undefined
                  ? "N/A"
                  : result.checkStatus[key].support
                    ? "&#10004;"
                    : "&#10060;"
                }
                ${result.checkStatus[key] ? result.checkStatus[key].time.toFixed(1) + "ms" : ''}    
                </td>`
            )
            .join("")}
            <td>${result.totalTime.toFixed(1)}ms </td>
        </tr>
      `;
        counts[result.provider] = 0;
      });

      table.innerHTML += htmlBuffer;
    }

    function displayProgress() {
      const nbOfTests = keySystems.length * 3 // for the 3 configurations
      const progressBar = document.querySelector("#progressbar");
      const resultsElement = document.querySelector("#results");
      resultsElement.style.display = "none";

      const intervalId = setInterval(() => {
        progressBar.textContent = `Running test: ${testAchieved}/${nbOfTests} (In Progress...)`
      }, 100)

      return function cleanUp() {
        clearInterval(intervalId)
        progressBar.style.display = "none";
        resultsElement.style.display = "block";
      }
    }

    /**
     *  Slowly scroll the page so it can be read on device without mouse/remote/controller.
     * */
    async function scrollPage() {
      const scrollSpeed = 1; // Adjust this value for scroll speed
      const stepDelay = 20; // Delay in milliseconds between scroll steps
      const pauseAtBottom = 3000; // Pause duration at the bottom (in milliseconds)
      const pauseAtTop = 3000; // Pause duration at the top (in milliseconds)
      const interactionPause = 5000; // Pause scrolling when user interact with page
      const EPSILON = 3; // Abritary value in px under which the page is considered to being scrolled down at maximum

      let isUserInteracting = false;
      let timeoutId;
      function handleUserInteraction() {
        // Disable scrolling and set a timeout to re-enable it after interactionPause
        isUserInteracting = true;
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
          isUserInteracting = false;
        }, interactionPause);
      }

      // Attach event listeners to detect user interaction
      document.addEventListener("mousemove", handleUserInteraction);
      document.addEventListener("keydown", handleUserInteraction);
      document.addEventListener("wheel", handleUserInteraction);

      function scrollDown() {
        if ( /* maximum scroll */ (window.document.documentElement.scrollHeight - window.innerHeight) - /* current scroll */ window.document.documentElement.scrollTop >= EPSILON) {
          if (isUserInteracting === false) {
            window.scrollTo(0, window.document.documentElement.scrollTop + scrollSpeed)
          }
          setTimeout(scrollDown, stepDelay)
        } else {
          // Stop at the bottom
          setTimeout(scrollUp, pauseAtBottom);
        }
      }
      function scrollUp() {
        if (/* maximum scroll */ (window.document.documentElement.scrollHeight - window.innerHeight) - /* current scroll */ window.document.documentElement.scrollTop < EPSILON) {
          if (isUserInteracting === false) {
            window.scrollTo(0, 0);
          }
        }
        setTimeout(scrollDown, stepDelay);
      }
      scrollDown()
    }
    scrollPage();
