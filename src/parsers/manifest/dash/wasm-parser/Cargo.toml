[package]
name = "mpd-node-parser"
version = "0.1.0"
authors = ["Paul Berberian <pea.berberian@gmail.com>"]
edition = "2018"

[lib]
path = "rs/lib.rs"
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 3

[dependencies]
# Keep this local dependency limited to the performance experiment. It differs
# from quick-xml 0.37.5 only by forcing its element scanner to be inlined.
quick-xml = { path = "vendor/quick-xml" }
