<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 90 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Shared CoreInterface path</title>
  <desc id="desc">Before version 4.5.0 monothreaded and multithreaded playback used more separate initialization paths. Version 4.5.0 routes both through a CoreInterface layer between main-thread initialization and core logic.</desc>

  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#d72657"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#1967d2"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #202124;
      }
      .title {
        font-size: 28px;
        font-weight: 700;
      }
      .panel-title {
        font-size: 22px;
        font-weight: 700;
      }
      .section {
        font-size: 16px;
        font-weight: 700;
      }
      .body {
        font-size: 15px;
      }
      .small {
        font-size: 13px;
        fill: #5f6368;
      }
      .code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
      }
      .muted {
        fill: #5f6368;
      }
    </style>
  </defs>

  <rect x="40" y="90" width="1120" height="500" fill="#ffffff"/>

  <!-- Before -->
  <rect x="60" y="110" width="480" height="400" rx="16" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>
  <text x="300" y="154" text-anchor="middle" class="panel-title">Before: split paths</text>

  <rect x="90" y="210" width="175" height="78" rx="12" fill="#fff6f8" stroke="#d72657" stroke-width="2.5"/>
  <text x="177" y="240" text-anchor="middle" class="section">Monothread init</text>
  <text x="177" y="266" text-anchor="middle" class="small">default path</text>

  <rect x="335" y="210" width="175" height="78" rx="12" fill="#f8f9fa" stroke="#4b5563" stroke-width="2.5"/>
  <text x="422" y="240" text-anchor="middle" class="section">MULTI_THREAD init</text>
  <text x="422" y="266" text-anchor="middle" class="small">multithread path</text>

  <path d="M177 288v54" stroke="#d72657" stroke-width="3" marker-end="url(#arrow-pink)"/>
  <path d="M422 288v54" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow-slate)"/>

  <rect x="90" y="352" width="175" height="76" rx="12" fill="#fff6f8" stroke="#d72657" stroke-width="2.5"/>
  <text x="177" y="382" text-anchor="middle" class="section">Core logic</text>
  <text x="177" y="408" text-anchor="middle" class="small">direct local calls</text>

  <rect x="335" y="352" width="175" height="76" rx="12" fill="#f8f9fa" stroke="#4b5563" stroke-width="2.5"/>
  <text x="422" y="382" text-anchor="middle" class="section">Core logic</text>
  <text x="422" y="408" text-anchor="middle" class="small">worker messages</text>

  <!-- Separator -->
  <line x1="580" y1="110" x2="580" y2="510" stroke="#9aa0a6" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M542 310h76" stroke="#1967d2" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- After -->
  <rect x="660" y="110" width="480" height="400" rx="16" fill="#ffffff" stroke="#1967d2" stroke-width="2"/>
  <text x="900" y="154" text-anchor="middle" class="panel-title">Now: shared CoreInterface layer</text>

  <rect x="810" y="198" width="180" height="70" rx="12" fill="#fff6f8" stroke="#d72657" stroke-width="2.5"/>
  <text x="900" y="226" text-anchor="middle" class="section">Main-thread init</text>
  <text x="900" y="250" text-anchor="middle" class="small">API, DRM, media element</text>

  <path d="M900 268v44" stroke="#d72657" stroke-width="3" marker-end="url(#arrow-pink)"/>
  <text x="925" y="294" class="small">messages</text>

  <rect x="828" y="322" width="144" height="62" rx="12" fill="#ffffff" stroke="#1967d2" stroke-width="3"/>
  <text x="900" y="360" text-anchor="middle" class="section">CoreInterface</text>

  <path d="M900 384v44" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow-slate)"/>

  <rect x="810" y="438" width="180" height="56" rx="12" fill="#f8f9fa" stroke="#4b5563" stroke-width="2.5"/>
  <text x="900" y="470" text-anchor="middle" class="section">Core logic</text>

  <rect x="678" y="322" width="118" height="62" rx="12" fill="#f8f9fa" stroke="#4b5563" stroke-width="2"/>
  <text x="737" y="347" text-anchor="middle" class="small">MULTI_THREAD</text>
  <text x="737" y="368" text-anchor="middle" class="code">postMessage</text>

  <rect x="1004" y="322" width="116" height="62" rx="12" fill="#fff6f8" stroke="#d72657" stroke-width="2"/>
  <text x="1062" y="347" text-anchor="middle" class="small">Monothread</text>
  <text x="1062" y="368" text-anchor="middle" class="code">listeners</text>

  <path d="M828 353h-32" stroke="#1967d2" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M972 353h32" stroke="#1967d2" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
</svg>
