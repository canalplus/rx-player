    <script>
(function () {
  const OriginalXHR = window.XMLHttpRequest;

  function PatchedXHR() {
    const xhr = new OriginalXHR();
    const originalSend = xhr.send;
    xhr.send = function (...args) {
      const BLOCK_FOR_MS = window.TIME;
      const start = performance.now();
      while (performance.now() - start < BLOCK_FOR_MS) {
        // github-style """sleep""" implem
        // ref: https://github.com/actions/runner/issues/3792#issuecomment-3182746514
      }
      return originalSend.apply(xhr, args);
    };

    return xhr;
  }
  for (const key in OriginalXHR) {
    if (Object.hasOwn(OriginalXHR, key)) {
      PatchedXHR[key] = OriginalXHR[key];
    }
  }
  window.XMLHttpRequest = PatchedXHR;
})();
window.TIME = 200; // Initial value
</script>
    <script type="text/javascript" src="./bundle.js" charset="utf-8"></script>
    <title>RxPlayer - CANAL+</title>
  </head>

    <div id="player-container"></div>
  </body>
