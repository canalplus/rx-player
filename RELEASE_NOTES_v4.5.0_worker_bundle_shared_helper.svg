<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 80 1136 608" role="img" aria-labelledby="title desc">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#d72657"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#1967d2"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #202124;
      }
      .title {
        font-size: 30px;
        font-weight: 700;
      }
      .panel-title {
        font-size: 24px;
        font-weight: 700;
      }
      .section {
        font-size: 18px;
        font-weight: 700;
      }
      .body {
        font-size: 16px;
      }
      .small {
        font-size: 14px;
        fill: #5f6368;
      }
      .code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 14px;
      }
      .code-small {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
      }
      .muted {
        fill: #5f6368;
      }
    </style>
  </defs>

  <!-- Application bundle -->
  <rect x="52" y="126" width="430" height="510" rx="18" fill="#fff6f8" stroke="#d72657" stroke-width="3"/>
  <text x="267" y="166" text-anchor="middle" class="panel-title">Application bundle</text>

  <rect x="86" y="198" width="362" height="76" rx="12" fill="#ffffff" stroke="#d72657" stroke-width="2"/>
  <text x="108" y="226" class="section">Use the player and attach its worker</text>
  <text x="108" y="252" class="code">rxPlayer.attachWorker({ workerUrl });</text>

  <rect x="86" y="308" width="362" height="162" rx="12" fill="#ffffff" stroke="#d72657" stroke-width="2"/>
  <text x="108" y="336" class="section">Call loadVideo with worker callback id</text>
  <text x="108" y="364" class="code">rxPlayer.loadVideo({</text>
  <text x="124" y="386" class="code">representationFilter: {</text>
  <text x="140" y="408" class="code">workerId: "resolution-filter",</text>
  <text x="124" y="430" class="code">},</text>
  <text x="108" y="452" class="code">});</text>

  <rect x="86" y="480" width="362" height="104" rx="12" fill="#ffffff" stroke="#d72657" stroke-width="2"/>
  <text x="108" y="508" class="section">Exchange messages</text>
  <text x="108" y="536" class="code">const w = rxPlayer.getWorkerInterface();</text>
  <text x="108" y="560" class="code">w.sendMessage("max-resolution", value);</text>

  <!-- Boundary -->
  <rect x="514" y="100" width="172" height="24" rx="10" fill="#ffffff"/>
  <text x="600" y="117" text-anchor="middle">WebWorker boundary</text>
  <line x1="600" y1="128" x2="600" y2="636" stroke="#9aa0a6" stroke-width="3" stroke-dasharray="10 12"/>

  <!-- Worker bundle -->
  <rect x="718" y="126" width="430" height="510" rx="18" fill="#f8f9fa" stroke="#4b5563" stroke-width="3"/>
  <text x="933" y="166" text-anchor="middle" class="panel-title">RxPlayer worker bundle</text>

  <rect x="752" y="198" width="362" height="96" rx="12" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="774" y="226" class="section">Instantiate RxPlayer core logic</text>
  <text x="774" y="252" class="code">RxPlayerWorker.addFeatures([DASH]);</text>
  <text x="774" y="274" class="code">const worker = new RxPlayerWorker();</text>

  <rect x="752" y="328" width="362" height="135" rx="12" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="774" y="356" class="section">Registration of callbacks</text>
  <text x="774" y="384" class="code">worker.registerRepresentationFilter(</text>
  <text x="790" y="406" class="code">"resolution-filter",</text>
  <text x="790" y="428" class="code">filterByResolution</text>
  <text x="774" y="450" class="code">);</text>

  <rect x="752" y="480" width="362" height="132" rx="12" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="774" y="508" class="section">App-defined messages listeners</text>
  <text x="774" y="536" class="code">worker.addMessageListener(</text>
  <text x="790" y="558" class="code">"max-resolution",</text>
  <text x="790" y="580" class="code">updateMaxResolutionValue</text>
  <text x="774" y="602" class="code">);</text>

  <!-- attachWorker arrow -->
  <path d="M448 236 C526 236 560 236 590 236" fill="none" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M610 236 C642 236 674 236 752 236" fill="none" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <rect x="546" y="256" width="108" height="24" rx="8" fill="#ffffff"/>
  <text x="600" y="273" text-anchor="middle" class="small">Loads worker</text>

  <!-- loadVideo workerId arrow -->
  <path d="M448 372 C526 372 560 372 590 372" fill="none" stroke="#d72657" stroke-width="3" marker-end="url(#arrow-pink)"/>
  <path d="M610 372 C642 372 674 372 752 372" fill="none" stroke="#d72657" stroke-width="3" marker-end="url(#arrow-pink)"/>
  <rect x="516" y="392" width="168" height="26" rx="8" fill="#ffffff"/>
  <text x="600" y="410" text-anchor="middle" class="small">References callback</text>

  <!-- getWorkerInterface messages -->
  <path d="M448 544 C528 544 558 544 590 544" fill="none" stroke="#1967d2" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M610 544 C642 544 672 544 752 544" fill="none" stroke="#1967d2" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="520" y="570" width="160" height="26" rx="8" fill="#ffffff"/>
  <text x="600" y="588" text-anchor="middle" class="small">Sends message</text>
  <rect x="310" y="642" width="578" height="26" rx="8" fill="#ffffff"/>
  <text x="600" y="660" text-anchor="middle" class="small">NOTE: worker.sendMessage(...) can also emit app-defined events back to the application</text>
</svg>
